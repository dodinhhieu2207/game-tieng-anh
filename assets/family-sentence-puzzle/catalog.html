<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Sentence Puzzle · Asset Kit</title><style>@font-face{font-family:Outfit;src:url('../fonts/Outfit-Bold.ttf')}*{box-sizing:border-box}body{margin:0;background:#eff7ee;color:#174d65;font-family:Outfit,Arial,sans-serif}header{max-width:1200px;margin:30px auto;padding:20px}h1{font-size:clamp(28px,4vw,44px);margin:0 0 10px}p{line-height:1.5}a{color:#206f80}.grid{max-width:1200px;margin:0 auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{margin:0;padding:14px;border:2px solid #abd0be;border-radius:20px;background:#fffbed}.card a{display:block;background:repeating-conic-gradient(#edf2e8 0% 25%,#fff 0% 50%) 50%/20px 20px;border-radius:12px}.card img{display:block;object-fit:contain;width:100%;height:170px}.card figcaption{margin-top:12px;font-size:17px}.card small{display:block;margin-top:7px;font-size:12px;overflow-wrap:anywhere;opacity:.7}.loading{padding:20px}</style><header><h1>Family Sentence Puzzle · Asset Kit</h1><p>Game artwork: desk, title, puzzle pieces, tray, controls, feedback seals, collection cards and completion album. Reading words remain live text. Approved family portraits and Higgs sentences are reused.</p><a href="../../index.html?release=family-puzzle-kit#/unit/4/lesson/2?mode=practice&amp;activity=family-sentence-puzzle">Open the game</a> · <a href="manifest.json">Asset manifest</a></header><main class="grid"><p class="loading">Loading the artwork…</p></main><script>fetch('manifest.json').then(r=>r.json()).then(data=>{const grid=document.querySelector('.grid');grid.replaceChildren();for(const item of data.graphics){const figure=document.createElement('figure');figure.className='card';const link=document.createElement('a');link.href=item.file;const img=document.createElement('img');img.src=item.file;img.alt=item.role;link.append(img);const caption=document.createElement('figcaption');caption.textContent=item.role;const name=document.createElement('small');name.textContent=item.file;caption.append(name);figure.append(link,caption);grid.append(figure)}}).catch(()=>document.querySelector('.grid').textContent='The manifest could not load. Refresh to retry.')</script></html>
