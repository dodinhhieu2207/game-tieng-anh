<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kk and Ll asset kit</title><style>@font-face{font-family:Outfit;src:url('../fonts/Outfit-ExtraBold.ttf')}*{box-sizing:border-box}body{font:20px Outfit,sans-serif;background:#edf8f3;color:#194b60;margin:0;padding:24px}main{max-width:1000px;margin:auto}h1{font-size:38px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-bottom:28px}article{text-align:center;background:#fff9e7;border:2px solid #abd3c7;border-radius:24px;padding:16px}article img{width:100%;height:190px;object-fit:contain}button{font:inherit;color:#194b60;border:0;border-radius:16px;background:#ffe095;padding:12px 18px;min-height:48px;cursor:pointer}button:focus-visible{outline:4px solid #368bd0}.lit img{filter:drop-shadow(0 0 12px #ffd559)}.pair img{height:150px}.status{min-height:32px}a{color:#17677c}</style><main><h1>Kk and Ll</h1><p>Letter artwork, pair badges and word cards. Buttons play the Higgs letter name or word.</p><section id="letters"></section><section id="pairs"></section><section id="words"></section><p class="status" role="status"></p><a href="../../index.html#/unit/4/lesson/5?mode=practice">Open Lesson 5</a></main><script>
const letters=[['upper-k','K','letter-k'],['lower-k','k','letter-k'],['upper-l','L','letter-l'],['lower-l','l','letter-l']];document.querySelector('#letters').innerHTML=letters.map(([f,l,a])=>`<article><img src="${f}.png" alt="${l}"><button data-a="${a}">Name ${l}</button></article>`).join('');document.querySelector('#pairs').innerHTML=['kk','ll'].map(l=>`<article class="pair"><img src="${l}-badge.png" alt="${l[0].toUpperCase()+l[1]}"><button data-a="letter-${l[0]}">Listen</button></article>`).join('');document.querySelector('#words').innerHTML=['kangaroo','key','lion','lollipop'].map(w=>`<article><img src="card-${w}.png" alt=""><button data-a="${w}">${w}</button></article>`).join('');let audio;document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;audio?.pause();document.querySelectorAll('.lit').forEach(n=>n.classList.remove('lit'));audio=new Audio('../key-quest/audio/'+b.dataset.a+'.mp3');const card=b.closest('article');audio.onplaying=()=>{card.classList.add('lit');document.querySelector('.status').textContent='Listen and repeat.'};audio.onended=audio.onpause=()=>card.classList.remove('lit');audio.onerror=()=>document.querySelector('.status').textContent='Audio unavailable. Tap to retry.';audio.play().catch(()=>document.querySelector('.status').textContent='Tap Listen to try again.')});document.addEventListener('visibilitychange',()=>{if(document.hidden)audio?.pause()});
</script></html>
