<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toy Delivery · Art pack</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f8ff;color:#164573;font:18px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}h1{font-size:36px;margin:0 0 8px}h2{margin-top:35px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}figure{margin:0;border:3px solid white;background:#fff9ef;border-radius:24px;padding:15px;text-align:center}img{width:100%;height:160px;object-fit:contain}figcaption{font-weight:750;margin-top:8px}.fx figure{background:repeating-conic-gradient(#e0f1f7 0% 25%,#f3fbff 0% 50%) 0/24px 24px}a{color:#12578b}@media(max-width:600px){main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:130px}}
</style><main><h1>Toy Delivery</h1><p>Button and effect art pack</p><p><a href="../../index.html?release=artfx#/unit/3/lesson/1?mode=practice&activity=u3match">Play the game</a></p><h2>Game buttons</h2><div class="grid" id="buttons"></div><h2>Effects</h2><div class="grid fx" id="effects"></div></main><script>
const names={up:'Up',down:'Down',takeoff:'Take off',pause:'Pause',resume:'Keep flying',hint:'Hear a hint',next:'Next delivery',replay:'Play again',home:'Choose activities'};buttons.innerHTML=Object.entries(names).map(([key,label])=>`<figure><img src="controls/${key}.webp" alt="${label}"><figcaption>${label}</figcaption></figure>`).join('');effects.innerHTML=['pickup-ring','wind','star','dust','confetti','bloom'].map(key=>`<figure><img src="vfx/${key}.webp" alt="${key}"><figcaption>${key.replaceAll('-',' ')}</figcaption></figure>`).join('');
</script></html>
