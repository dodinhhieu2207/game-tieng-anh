<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Short e mouth guide</title>
  <desc id="desc">A front view of relaxed lips and a side view showing the tongue low and forward for the short e sound.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#fff3c9"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2b5"/>
      <stop offset="1" stop-color="#ffae8a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#173b75" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#2367c7"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="904" height="404" rx="38" fill="url(#panel)" stroke="#e7b941" stroke-width="6"/>
  <path d="M458 38v344" stroke="#ead58f" stroke-width="4" stroke-dasharray="10 13"/>

  <g filter="url(#shadow)">
    <rect x="42" y="42" width="376" height="336" rx="30" fill="#fff"/>
    <rect x="502" y="42" width="376" height="336" rx="30" fill="#fff"/>
  </g>

  <g aria-label="Front mouth view">
    <circle cx="230" cy="197" r="119" fill="url(#skin)" stroke="#173b75" stroke-width="7"/>
    <circle cx="185" cy="162" r="7" fill="#173b75"/>
    <circle cx="275" cy="162" r="7" fill="#173b75"/>
    <path d="M204 181q26 18 52 0" fill="none" stroke="#d47764" stroke-width="7" stroke-linecap="round"/>
    <path d="M150 224q80-54 160 0-80 77-160 0Z" fill="#ef766f" stroke="#173b75" stroke-width="7" stroke-linejoin="round"/>
    <path d="M164 224q66-30 132 0-66 26-132 0Z" fill="#482647"/>
    <path d="M171 220q59-23 118 0-59 15-118 0Z" fill="#fff"/>
    <path d="M181 235q49 19 98 0-10 33-49 35-39-2-49-35Z" fill="#ff9a9a"/>
    <path d="M128 304h204" stroke="#2367c7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="230" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#173b75">RELAXED LIPS</text>
  </g>

  <g aria-label="Side tongue position">
    <path d="M598 93q86-30 154 21 38 29 40 81 2 48-31 75-29 24-73 26-41 1-71-15-26-14-36-39-8-20-2-42 8-27 35-41 18-10 18-31 0-22-34-35Z" fill="url(#skin)" stroke="#173b75" stroke-width="7" stroke-linejoin="round"/>
    <path d="M650 171q49-16 100 13-10 55-57 68-50 13-91-18 48 6 73-18 19-19-25-45Z" fill="#612f4c" stroke="#173b75" stroke-width="6"/>
    <path d="M608 232q53 13 87-4 27-13 46-38-4 51-46 66-49 17-87-24Z" fill="#ff8f91" stroke="#173b75" stroke-width="5"/>
    <path d="M665 202q39 9 76-12" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <circle cx="718" cy="130" r="7" fill="#173b75"/>
    <path d="M551 307q66-25 130-65" fill="none" stroke="#2367c7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text x="690" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#173b75">TONGUE FORWARD</text>
  </g>

  <g transform="translate(424 18)">
    <circle cx="36" cy="36" r="34" fill="#ffcb57" stroke="#173b75" stroke-width="5"/>
    <text x="36" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#173b75">/e/</text>
  </g>
</svg>
